<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ERGOSPHERE</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
</head><body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="msg"></div>
<button id="gear" aria-label="Settings">&#9776;</button>
<div id="touch" hidden>
  <div id="lookzone"></div>
  <div id="stick"><div id="nub"></div></div>
  <div id="btns">
    <button data-b="w">W</button><button data-b="portal">&#9678;</button><button data-b="rewind">&#8634;</button>
  </div>
</div>
<div id="start" class="panel">
  <h1>ERGOSPHERE</h1>
  <p>Station Ergosphere. The airlock is already open.</p>
  <button id="go" disabled>Enter</button>
  <button id="opt">Settings</button>
</div>
<div id="menu" class="panel" hidden>
  <h2>Settings</h2>
  <label>Reduce effects <input type="checkbox" id="s-reduce"></label>
  <label>Look sensitivity <input type="range" id="s-sens" min="0.3" max="2.5" step="0.05"></label>
  <label>Vignette <input type="range" id="s-vig" min="0" max="1" step="0.05"></label>
  <button id="resume">Resume</button>
</div>
<script type="module" src="js/main.js"></script>
</body></html>
